# Dragon Ball Z: Burst Limit Recompiled - ReXGlue manifest.
#
# Codegen now runs as part of the build, so generated/ is rewritten on every
# change to this file. Do NOT hand-edit generated/*.cpp; put code changes in
# [[midasm_hook]] entries below and implement them in src/.

[project]
name = "burstlimit"
sdk_version = "0.10.0"
game_root = "game_data_root"

[entrypoint]
file_path = "game_data_root/default.xex"
out_directory_path = "generated/default"
includes = []

[entrypoint.functions]
0x820CF7B0 = {}
0x8247C690 = {}
0x823A0B50 = {}
0x824A8918 = {}
0x8216CC00 = {}
0x822164E0 = {}
0x824D7440 = {}
0x824ED0C8 = {}

# --- 60 FPS patch (src/burstlimit_patches.cpp) ---

# li r3,2 ; bl sub_82218940  -> frame interval 1 when patch_60fps is on.
[[entrypoint.midasm_hook]]
address = 0x8221CFEC
name = "BurstLimit60FpsForceCap"
registers = ["r3"]
after_instruction = true

[[entrypoint.midasm_hook]]
address = 0x82232AEC
name = "BurstLimit60FpsForceCap"
registers = ["r3"]
after_instruction = true

# The third place the game asks for 30 FPS (sub_82238018, the title attract
# demo's setup, mode 15).
[[entrypoint.midasm_hook]]
address = 0x822382A0
name = "BurstLimit60FpsForceCap"
registers = ["r3"]
after_instruction = true

# Cutscenes (battle+574 & 2): the motion and camera clocks advance half a frame
# per tick (the game was made for 30 FPS) and are rounded to whole frames
# before posing - (int)(t + 0.4) - so poses change only every other tick.
# r11 = 0 takes the fight path, which samples the time as it is (blending
# between keyframes). The clocks themselves are unchanged.
# sub_821A9CC8: a character's body motion time.
[[entrypoint.midasm_hook]]
address = 0x821A9D60
name = "BurstLimitDramaSmoothMotion"
registers = ["r11"]
after_instruction = true

# sub_8216CD68: the cutscene camera's time.
[[entrypoint.midasm_hook]]
address = 0x8216CDC8
name = "BurstLimitDramaSmoothMotion"
registers = ["r11"]
after_instruction = true

# beq when the tick counter is 0: with interval 1 it is always 0, so the
# match-quit and pause (START) paths never run and the game locks up.
[[entrypoint.midasm_hook]]
address = 0x821DBE10
name = "BurstLimit60FpsSkipTickGate"
registers = ["cr6"]

[[entrypoint.midasm_hook]]
address = 0x821DCE98
name = "BurstLimit60FpsSkipTickGate"
registers = ["cr6"]

# Same gate on the Training menu's "Reset Standing Position" path.
[[entrypoint.midasm_hook]]
address = 0x821DC428
name = "BurstLimit60FpsSkipTickGate"
registers = ["cr6"]

# --- Play time (src/burstlimit_patches.cpp) ---

# The play time counter adds a second every 60 presented frames, so it ran
# fast above 60 FPS: real seconds instead (skips to RtlLeaveCriticalSection).
[[entrypoint.midasm_hook]]
address = 0x822192E8
name = "BurstLimitPlayTime"
registers = ["r31"]
jump_address = 0x8221933C

# --- Field of view (src/burstlimit_patches.cpp) ---

# sub_820E7058, the scene's projection: bl sub_820EDAC0 hands the matrix at r4
# to the renderer.
[[entrypoint.midasm_hook]]
address = 0x820E7110
name = "BurstLimitSceneProjectionFov"
registers = ["r4"]

# sub_82123FC0, the projection the effects use, after its last store to the
# matrix at r30 (before the epilogue).
[[entrypoint.midasm_hook]]
address = 0x8212405C
name = "BurstLimitProjectionFov"
registers = ["r30"]

# --- Free camera (src/burstlimit_camera.cpp) ---

# Main loop (sub_822197D0), once per game tick, right before the task
# scheduler runs the update and drawing tasks (also applies the freeze). r30
# is unused.
[[entrypoint.midasm_hook]]
address = 0x822198F8
name = "BurstLimitCameraFrame"
registers = ["r30"]

# [SYS] PREDRAW (sub_8216CAF0): the render camera (r30, view index r31), after
# the game copied its camera in charge into it, before the view is built.
[[entrypoint.midasm_hook]]
address = 0x8216CB94
name = "BurstLimitCameraApply"
registers = ["r30", "r31"]

# [SYS] D_SEQ0 (sub_82128E40), two-camera branch: r3 = the main view's camera.
[[entrypoint.midasm_hook]]
address = 0x82128F30
name = "BurstLimitDualCameraView"
registers = ["r3"]

# --- Start transformed (src/burstlimit_forms.cpp) ---

# Character select, sub_82249140: the screen's logic runs (r31 = its object).
[[entrypoint.midasm_hook]]
address = 0x82249174
name = "BurstLimitCharSelectFrame"
registers = ["r31"]

# Where a side's cursor checks Y (Change Color): RB / LB change the start form.
[[entrypoint.midasm_hook]]
address = 0x8224A860
name = "BurstLimitCharSelectButtons"
registers = ["r19", "r30", "r31"]

# Character select init sub_82244F60: after it caps the colors of Goku, Kid
# Gohan and Teen Gohan (li r11,2 / li r9,3 ... stw r11,728(r30)) - the
# story-only costumes come back (story_costumes).
[[entrypoint.midasm_hook]]
address = 0x8224530C
name = "BurstLimitStoryCostumes"
registers = ["r30"]

# Character loader sub_82181BB0, right before it reads the start form from the
# match request entry (lhz r28,6(r20)) to load that form's model.
[[entrypoint.midasm_hook]]
address = 0x82181E24
name = "BurstLimitStartFormLoad"
registers = ["r20", "r24"]

# --- Extra stages on the Versus / Training stage select (src/burstlimit_stages.cpp) ---
# Stage select setup sub_82263628, right before bl sub_82261DF8 fills partners,
# locks and RANDOM's pool from the 6-entry list (r31 = the screen's object).
[[entrypoint.midasm_hook]]
address = 0x822637FC
name = "BurstLimitStagesInit"
registers = ["r31"]

# End of sub_82233E78 (is stage r4 unlocked; r3 = the answer).
[[entrypoint.midasm_hook]]
address = 0x82233EAC
name = "BurstLimitStagesUnlock"
registers = ["r3", "r4"]

# sub_82263628 after sub_82261DF8 (r18 = the stage the cursor goes back to).
[[entrypoint.midasm_hook]]
address = 0x82263800
name = "BurstLimitStagesRefresh"
registers = ["r18", "r31"]

# sub_822605A0 (carousel cards): lhzx r11 = the card's sprite of the stage's group.
[[entrypoint.midasm_hook]]
address = 0x82260680
name = "BurstLimitStagesCardPart"
registers = ["r11", "r27"]
after_instruction = true

# sub_822605A0: the card's sprite is made (r3).
[[entrypoint.midasm_hook]]
address = 0x822606AC
name = "BurstLimitStagesCardTexture"
registers = ["r3", "r27", "r29", "r30"]

# sub_82260710 (big picture): lhzx r10 = its sprite of the stage's group.
[[entrypoint.midasm_hook]]
address = 0x82260920
name = "BurstLimitStagesPreviewPart"
registers = ["r10", "r25"]
after_instruction = true

# sub_82260710: the big picture's sprite is made (r3), before stw r3,32(r31).
[[entrypoint.midasm_hook]]
address = 0x82260C20
name = "BurstLimitStagesPreviewTexture"
registers = ["r3", "r25", "r31"]

# sub_82261FC8 (the stage select's frame), after the cards' and big picture's
# animations set their textures again, before they're copied to the carousel
# (r22 = the stage select's globals).
[[entrypoint.midasm_hook]]
address = 0x822620E4
name = "BurstLimitStagesPictures"
registers = ["r22"]

# sub_82260710: stw r3,0(r24) keeps the stage's name text.
[[entrypoint.midasm_hook]]
address = 0x82260C64
name = "BurstLimitStagesName"
registers = ["r3", "r25"]

# sub_82263538 (the stage's preview movie, r3 = the stage).
[[entrypoint.midasm_hook]]
address = 0x82263538
name = "BurstLimitStagesMovie"
registers = ["r3"]
return_on_true = true

# NTXR loader sub_820EB688, before bl sub_820F3F88 makes a texture: r26 = the
# NTXR version, r29 = the texture's index in the file, r30 = its header. The
# new entries' pictures go into UISTS_TOP.NUT textures 33-35 here.
[[entrypoint.midasm_hook]]
address = 0x820EB784
name = "BurstLimitStagesThumbnailData"
registers = ["r26", "r29", "r30"]

# --- Online (src/burstlimit_patches.cpp) ---

# cmpwi cr6,r11,6 -> 2 while online_input_delay_test is on: resend unacked
# reliable messages every 2 driver ticks instead of 6.
[[entrypoint.midasm_hook]]
address = 0x82293A40
name = "BurstLimitOnlineInputDelay"
registers = ["r11", "cr6"]
after_instruction = true

# --- Online latency: the frame driver sub_8217E100 puts its task to sleep for
# 3 frames after each tick (li r4,3 ; bl sub_82122310), so online input is
# sampled and exchanged at 15 Hz. online_fast_tick makes it run every frame.
[[entrypoint.midasm_hook]]
address = 0x8217E178
name = "BurstLimitOnlineDriverSleep"
registers = ["r4"]
after_instruction = true

[[entrypoint.midasm_hook]]
address = 0x8217E1B8
name = "BurstLimitOnlineDriverSleep"
registers = ["r4"]
after_instruction = true

# --- Online input channel + exact input delay (src/burstlimit_netinput.cpp) ---

# sub_8217E650 (match input reset), li r9,3: the first input frame. With an
# exact delay D online, D rounded up to a multiple of 3.
[[entrypoint.midasm_hook]]
address = 0x8217E6CC
name = "BurstLimitOnlineResetFrame"
registers = ["r9"]
after_instruction = true

# sub_8217E650, cmpwi cr6,r31,3: neutral input pre-filled below the first frame.
[[entrypoint.midasm_hook]]
address = 0x8217E7EC
name = "BurstLimitOnlineResetPrefill"
registers = ["r31", "cr6"]
after_instruction = true

# sub_8217E4E8 (consume), addi r5,r10,-3: the frame taken = tick frame - D
# (online driver state 3 only).
[[entrypoint.midasm_hook]]
address = 0x8217E510
name = "BurstLimitOnlineConsumeFrame"
registers = ["r5", "r10"]
after_instruction = true

# sub_8217E860 (online driver state 3), bl sub_8217E4E8: before the consume,
# send this tick's input and write the other PC's frames into its ring.
[[entrypoint.midasm_hook]]
address = 0x8217E874
name = "BurstLimitOnlineBeforeConsume"

# sub_8217E860, mr r31,r3 after the consume: state hash for the desync check.
[[entrypoint.midasm_hook]]
address = 0x8217E878
name = "BurstLimitOnlineAfterConsume"
registers = ["r3"]

# sub_8217E100, bl sub_82176F68 (set the hold bit 0x40000000): optional
# effect/HUD timer freeze during short holds (online_hold_freeze).
[[entrypoint.midasm_hook]]
address = 0x8217E22C
name = "BurstLimitOnlineHold"

# sub_82179DC8 (battle start), cmpwi cr6,r3,6: the fight starts when the next
# input frame is 6 = the first frame (3) + the delay (3), i.e. when the
# pre-filled neutral input is used up. With an exact delay: first frame + D.
[[entrypoint.midasm_hook]]
address = 0x82179E00
name = "BurstLimitOnlineFightStartFrame"
registers = ["r3", "cr6"]
after_instruction = true

# --- Mods menu (src/burstlimit_mods.cpp) ---
# A "Mods" entry after Options in the main menu; A on it opens the Mods panel.

# sub_8224F690 (main menu list made, r30 = the list with its 6 items), li r4,120
# before it's measured: add "Mods" by running the last add (bl sub_82288A70 at
# 0x8224F7AC, r3 = list, r4 = text) once more.
[[entrypoint.midasm_hook]]
address = 0x8224F7B0
name = "BurstLimitModsMenuAddItem"
registers = ["r3", "r4", "r30"]
jump_address_on_true = 0x8224F7AC

# sub_82251108 (main menu), the cursor moved (r30 = item): the art behind the
# list comes from 6-entry tables - Mods keeps Options' art.
[[entrypoint.midasm_hook]]
address = 0x82251278
name = "BurstLimitModsMenuArtCursor"
registers = ["r30"]

# sub_82251108, cmplwi cr6,r3,5 (descriptions only for items 0-5): Mods' own.
[[entrypoint.midasm_hook]]
address = 0x82251794
name = "BurstLimitModsMenuHelpIndex"
registers = ["r3", "r30"]
jump_address_on_true = 0x822517B4

# sub_82251108, bl sub_822803E0 (the description's text by id r30).
[[entrypoint.midasm_hook]]
address = 0x822517C8
name = "BurstLimitModsMenuHelpText"
registers = ["r3", "r30"]
jump_address_on_true = 0x822517CC

# sub_8228DDA0 (a list's input), beq when the confirm button isn't pressed
# (r31 = the list): A on Mods opens the Mods panel instead of confirming.
[[entrypoint.midasm_hook]]
address = 0x8228E8DC
name = "BurstLimitModsMenuConfirm"
registers = ["cr6", "r31"]

# sub_82251108 (main menu, every frame), mr r3,r27 right after its own optional
# bl sub_8210C198 (menu sound): the Mods panel's sounds run that call again.
[[entrypoint.midasm_hook]]
address = 0x82251620
name = "BurstLimitModsMenuSound"
registers = ["r3", "r4", "r6", "f1"]
jump_address_on_true = 0x8225161C

# Ki charge (src/burstlimit_kicharge.cpp). sub_821721D8 (local input task),
# b 0x82172364 after sub_821706B0 built the controller's command word (r31+64),
# only when input isn't locked: L3 (without R3) goes into bit 31.
[[entrypoint.midasm_hook]]
address = 0x82172340
name = "BurstLimitKiChargeInput"
registers = ["r31"]

# sub_82172A30 (a fighter's command step in the battle, r21 = fighter), addi
# r4,r1,80 right after bl sub_8217E060 read the consumed command word into
# r1+80: start / keep / end the charge.
[[entrypoint.midasm_hook]]
address = 0x82172AA4
name = "BurstLimitKiChargeCommand"
registers = ["r1", "r21", "r31"]

# sub_821A1260 (action lookup, r31 = fighter), cmplwi cr6,r8,0 after the
# search: the charge's action ids get their records.
[[entrypoint.midasm_hook]]
address = 0x821A135C
name = "BurstLimitKiChargeAction"
registers = ["r6", "r8", "r11", "r31"]

# sub_82145E98 (the auras, drawing; r29 = player, r30 = fighter, r31 = aura
# state), lwz r11,64(r31) after the strength +40 is worked out: full strength
# while charging Ki.
[[entrypoint.midasm_hook]]
address = 0x821460F0
name = "BurstLimitKiChargeAura"
registers = ["r29", "r30", "r31"]

# --- "Online" instead of "Xbox LIVE" (src/burstlimit_branding.cpp) ---

# sub_8228F6A0 (a screen's text by index, via sub_822803E0), its blr: r3 = the
# text; texts with "Xbox LIVE" get an "Online" copy.
[[entrypoint.midasm_hook]]
address = 0x8228F6D8
name = "BurstLimitBrandingScreenText"
registers = ["r3"]

# sub_8228F5C0 (the common texts by id: Unlock / Kiyaku / MenuCommon), the blr
# after a table's text: r3 = the text.
[[entrypoint.midasm_hook]]
address = 0x8228F664
name = "BurstLimitBrandingCommonText"
registers = ["r3"]

# NTXR loader sub_820EB688, addi r3,r28,16 right before the stage thumbnails'
# hook (same registers): the "Xbox LIVE BATTLE" title textures of UIVNT_TOP.NUT
# become "ONLINE BATTLE".
[[entrypoint.midasm_hook]]
address = 0x820EB780
name = "BurstLimitBrandingTexture"
registers = ["r26", "r29", "r30"]

# --- Button icons of the controller in use (src/burstlimit_buttons.cpp) ---
# (The textures are redrawn from the 0x820EB780 hook above.)

# sub_820F89F8 (fills a texture: memory at [r31 + 80], the NTXR header r28's
# data tiled into it by sub_82512BC0), right after the tiling: where a redrawn
# texture went, to redraw it in place when the setting changes.
[[entrypoint.midasm_hook]]
address = 0x820F8B54
name = "BurstLimitButtonsTextureMade"
registers = ["r28", "r31"]
